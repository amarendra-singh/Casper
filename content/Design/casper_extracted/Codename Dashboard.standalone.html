  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

er-radius:var(--r-shell);\n    box-shadow:var(--shadow-shell);\n    display:grid;\n    grid-template-columns:64px 208px 1fr;\n    overflow:hidden;\n    position:relative;\n  }\n\n  /* ---------- Icon rail ---------- */\n  .rail{\n    display:flex;flex-direction:column;align-items:center;\n    padding:18px 0;gap:6px;\n    border-right:1px solid transparent;\n  }\n  .logo{\n    width:36px;height:36px;border-radius:10px;background:var(--ink);\n    color:#fff;display:grid;place-items:center;font-weight:600;font-size:18px;\n    letter-spacing:-.02em;margin-bottom:18px;\n  }\n  .rail-btn{\n    width:40px;height:40px;border-radius:12px;display:grid;place-items:center;\n    color:#6E6C68;cursor:pointer;transition:background .15s ease,color .15s ease;\n    position:relative;\n  }\n  .rail-btn:hover{background:rgba(0,0,0,.04);color:var(--ink)}\n  .rail-btn.active{background:var(--pink);color:#fff;box-shadow:0 6px 14px -4px rgba(236,45,110,.55)}\n  .rail-spacer{flex:1}\n  .rail-btn .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 2px var(--shell)}\n\n  /* ---------- File tree ---------- */\n  .tree{\n    padding:22px 14px 16px;\n    color:#6E6C68;\n    font-size:13px;\n    line-height:1.6;\n    overflow:auto;\n  }\n  .tree::-webkit-scrollbar{width:0}\n  .tree-group{margin-bottom:10px}\n  .tree-row{\n    display:flex;align-items:center;gap:8px;\n    padding:5px 8px;border-radius:8px;cursor:pointer;\n    color:#6E6C68;\n  }\n  .tree-row:hover{background:rgba(0,0,0,.035);color:var(--ink)}\n  .tree-row.active{color:var(--pink);font-weight:500}\n  .tree-row .ic{width:14px;height:14px;display:grid;place-items:center;color:#B8B6B2;flex:none}\n  .tree-row.has-child{font-weight:500;color:#3a3a3d}\n  .tree-row .badge{\n    margin-left:auto;background:var(--pink);color:#fff;font-size:10px;font-weight:600;\n    border-radius:5px;padding:1px 6px;min-width:18px;text-align:center;line-height:14px;\n  }\n  .tree-row .badge.muted{background:#E8E5E2;color:#7a7873}\n  .tree-children{padding-left:18px}\n  .tree-section{\n    font-size:11px;letter-spacing:.06em;text-transform:uppercase;\n    color:#A8A6A2;padding:14px 8px 6px;font-weight:500;\n  }\n\n  /* ---------- Top app bar (outside canvas card) ---------- */\n  .topbar{\n    display:flex;align-items:center;gap:16px;\n    padding:16px 20px 14px 8px;\n  }\n  .brand{display:flex;align-items:center;gap:8px;font-size:14px;color:#3a3a3d;font-weight:500}\n  .brand .caret{color:#B8B6B2}\n  .search{\n    flex:1;max-width:520px;height:40px;border-radius:var(--r-pill);\n    background:#EFEDE9;display:flex;align-items:center;gap:10px;padding:0 16px;\n    color:#A8A6A2;font-size:13px;\n  }\n  .search input{\n    border:0;background:transparent;outline:none;flex:1;font:inherit;color:var(--ink);\n  }\n  .search input::placeholder{color:#A8A6A2}\n  .top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}\n  .icon-btn{\n    width:40px;height:40px;border-radius:50%;display:grid;place-items:center;\n    color:#3a3a3d;cursor:pointer;transition:background .15s;\n  }\n  .icon-btn:hover{background:rgba(0,0,0,.04)}\n  .avatar-orb{\n    width:32px;height:32px;border-radius:50%;\n    background:conic-gradient(from 200deg,#FFD27A,#EC2D6E 40%,#7A5BFF 70%,#3DD68C);\n    box-shadow:inset 0 0 0 2px #fff;\n  }\n  .plus-btn{\n    width:40px;height:40px;border-radius:50%;background:var(--pink);color:#fff;\n    display:grid;place-items:center;cursor:pointer;\n    box-shadow:0 8px 18px -6px rgba(236,45,110,.55);\n  }\n\n  /* ---------- Canvas card ---------- */\n  .canvas-wrap{padding:0 16px 16px 0;flex:1;min-height:0;display:flex;}\n  .canvas{\n    flex:1;min-height:0;\n    background:var(--canvas);border-radius:20px;\n    box-shadow:var(--shadow-card);\n    padding:18px 22px 22px;\n    overflow:auto;\n  }\n\n  /* ---------- Report header (inside canvas) ---------- */\n  .report-header{\n    display:flex;align-items:center;gap:12px;\n  }\n  .chip-circle{\n    width:30px;height:30px;border-radius:50%;background:#F2F0EC;color:#7a7873;\n    display:grid;place-items:center;cursor:pointer;\n    border:1px solid #EDEAE6;\n  }\n  .collab-chip{\n    display:flex;align-items:center;gap:6px;\n    background:#fff;border:1px solid #EDEAE6;border-radius:var(--r-pill);\n    padding:3px 10px 3px 3px;font-size:12px;color:#3a3a3d;font-weight:500;\n  }\n  .collab-chip img,.collab-chip .av{\n    width:22px;height:22px;border-radius:50%;object-fit:cover;flex:none;\n  }\n  .collab-chip .av{display:grid;place-items:center;color:#fff;font-size:10px;font-weight:600}\n  .header-right{margin-left:auto;display:flex;align-items:center;gap:8px}\n  .ghost-btn{\n    width:34px;height:34px;border-radius:10px;display:grid;place-items:center;\n    color:#6E6C68;cursor:pointer;transition:background .15s;\n  }\n  .ghost-btn:hover{background:rgba(0,0,0,.04)}\n\n  /* ---------- Toggle (Timeframe) ---------- */\n  .toggle-row{display:flex;align-items:center;gap:10px;margin-left:6px}\n  .switch{\n    width:38px;height:22px;border-radius:var(--r-pill);background:var(--ink);\n    position:relative;cursor:pointer;flex:none;\n  }\n  .switch::after{\n    content:\"\";position:absolute;top:3px;left:18px;width:16px;height:16px;border-radius:50%;\n    background:#fff;transition:left .2s;\n  }\n  .switch.off{background:#D9D6D2}\n  .switch.off::after{left:3px}\n  .toggle-row .lbl{font-size:13px;color:#3a3a3d;font-weight:500}\n  .date-pill{\n    display:flex;align-items:center;gap:8px;\n    background:#fff;border:1px solid #EDEAE6;border-radius:var(--r-pill);\n    padding:7px 14px;font-size:13px;color:var(--ink);font-weight:500;cursor:pointer;\n  }\n  .date-pill .caret{color:#B8B6B2}\n\n  /* row two — title + timeframe right side */\n  .header-meta{\n    display:flex;align-items:center;justify-content:flex-end;gap:12px;\n    margin-top:14px;\n  }\n  /* push timeframe up beside collaborators on wide screens */\n  @media (min-width:1100px){\n    .report-header{flex-wrap:nowrap}\n    .header-meta{position:absolute;right:38px;top:0;margin-top:0}\n    .canvas{position:relative}\n  }\n\n  /* ---------- Hero row ---------- */\n  .hero-row{\n    display:grid;grid-template-columns:minmax(360px,1fr) auto;\n    align-items:flex-end;gap:24px;margin-top:6px;\n  }\n  .report-title{\n    font-size:46px;line-height:1;font-weight:300;color:#D8D5D2;\n    letter-spacing:-.02em;margin:0 0 18px;\n  }\n  .kpi-label{font-size:13px;color:#6E6C68;margin-bottom:6px;font-weight:500}\n  .kpi-amount{\n    display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;\n    font-size:54px;line-height:1;font-weight:600;letter-spacing:-.02em;\n  }\n  .kpi-amount .cents{color:#C9C6C2;font-weight:500}\n  .delta{\n    display:inline-flex;align-items:center;gap:4px;\n    border-radius:var(--r-pill);padding:5px 10px;font-size:12px;font-weight:600;\n    line-height:1;\n  }\n  .delta.up{background:var(--pink);color:#fff}\n  .delta.up-light{background:var(--pink-soft);color:var(--pink)}\n  .delta.dark{background:var(--ink);color:#fff}\n  .delta.green{background:#E8F8EF;color:#1FA968}\n  .kpi-sub{\n    margin-top:10px;font-size:12px;color:#9A9A9F;display:flex;gap:8px;align-items:center;\n  }\n  .kpi-sub .dot{width:3px;height:3px;border-radius:50%;background:#C9C6C2}\n\n  /* ---------- Stat cards ---------- */\n  .stat-cards{\n    display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;\n    min-width:520px;\n  }\n  .stat{\n    background:#fff;border:1px solid #EDEAE6;border-radius:14px;\n    padding:11px 12px 12px;display:flex;flex-direction:column;gap:8px;\n    min-height:90px;position:relative;cursor:pointer;\n    transition:transform .15s, box-shadow .15s;\n  }\n  .stat:hover{transform:translateY(-1px);box-shadow:var(--shadow-card)}\n  .stat .top{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:#6E6C68;font-weight:500}\n  .stat .top .ic{color:#B8B6B2}\n  .stat .val{font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1}\n  .stat .foot{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#6E6C68}\n  .stat .foot .av{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:9px;font-weight:600}\n  .stat .chev{\n    width:18px;height:18px;border-radius:50%;background:#fff;color:#3a3a3d;\n    display:grid;place-items:center;margin-left:auto;\n    box-shadow:0 1px 2px rgba(0,0,0,.06);\n  }\n  .stat.dark{background:var(--ink);color:#fff;border-color:var(--ink)}\n  .stat.dark .top{color:#9A9A9F}\n  .stat.dark .foot{color:#B8B6B2}\n  .stat.dark .chev{background:#fff;color:var(--ink)}\n  .stat.active{border:1.5px solid var(--pink);background:#fff}\n  .stat .diamond{display:inline-block;width:7px;height:7px;background:#3a3a3d;transform:rotate(45deg);margin-right:3px;vertical-align:middle}\n  .stat.dark .diamond{background:#fff}\n\n  /* ---------- Data strip (Phase 4) ---------- */\n  .data-strip{\n    margin-top:18px;\n    display:flex;align-items:center;gap:8px;\n    background:#EFEDE9;border-radius:var(--r-pill);\n    padding:5px;\n  }\n  .ds-cell{\n    flex:1;display:flex;align-items:center;gap:9px;\n    padding:7px 0 7px 6px;font-size:13px;color:var(--ink);font-weight:500;\n    background:#fff;border-radius:var(--r-pill);\n    box-shadow:0 1px 1px rgba(20,20,30,.04);\n    white-space:nowrap;min-width:0;\n    position:relative;\n  }\n  .ds-cell .av{\n    width:26px;height:26px;border-radius:50%;flex:none;\n    background-size:cover;background-position:center;\n  }\n  .ds-cell .av.letter{display:grid;place-items:center;color:#fff;font-size:11px;font-weight:600}\n  .ds-cell .av.brand{display:grid;place-items:center;background:#fff;border:1px solid #EDEAE6;overflow:hidden}\n  .ds-cell .av.brand svg{width:100%;height:100%;display:block}\n\n  /* Brand mark fills */\n  .brand-flipkart{background:#2874F0}\n  .brand-flipkart::after{content:\"F\";color:#FFE500;font-weight:700;font-size:13px;font-style:italic;font-family:'Geist',sans-serif;line-height:1;display:block;margin-top:1px}\n  .brand-snapdeal{background:#E40046}\n  .brand-snapdeal::after{content:\"S\";color:#fff;font-weight:700;font-size:13px;font-family:'Geist',sans-serif;line-height:1;display:block}\n  .brand-meesho{background:#F43397}\n  .brand-meesho::after{content:\"m\";color:#fff;font-weight:700;font-size:14px;font-family:'Geist',sans-serif;line-height:1;display:block;margin-top:-1px}\n  .ds-cell .av.brand-flipkart,\n  .ds-cell .av.brand-snapdeal,\n  .ds-cell .av.brand-meesho{display:grid;place-items:center;border:none}\n  .ds-cell .amt{flex:none}\n  .ds-cell .pct{\n    margin-left:auto;color:#B8B6B2;font-weight:500;flex:none;\n    padding:0 16px 0 8px;\n    -webkit-mask-image:linear-gradient(90deg,#000 0,#000 50%,transparent 100%);\n            mask-image:linear-gradient(90deg,#000 0,#000 50%,transparent 100%);\n  }\n  .ds-cta{\n    background:var(--ink);color:#fff;border-radius:var(--r-pill);\n    padding:11px 22px;font-size:13px;font-weight:500;cursor:pointer;flex:none;\n    transition:transform .15s;\n  }\n  .ds-cta:hover{transform:translateY(-1px)}\n\n  /* Brand marks — wrappers, SVG content lives in markup */\n  .av.brand-dribbble,.av.brand-instagram,.av.brand-behance,.av.brand-google,\n  .av.brand-flipkart,.av.brand-snapdeal,.av.brand-meesho{\n    width:28px;height:28px;display:grid;place-items:center;\n    background:transparent;flex:none;overflow:visible;\n  }\n  .av.brand-dribbble svg,.av.brand-instagram svg,.av.brand-behance svg,.av.brand-google svg{\n    width:100%;height:100%;display:block;\n  }\n  /* Flipkart/Snapdeal/Meesho letter marks (still used in data strip + user table) */\n  .av.brand-flipkart{background:#2874F0;color:#FFE500;font-style:italic;font-size:13px;font-weight:700;border-radius:50%;width:24px;height:24px}\n  .av.brand-flipkart::after{content:\"F\"}\n  .av.brand-snapdeal{background:#E40046;color:#fff;font-size:13px;font-weight:700;border-radius:50%;width:24px;height:24px}\n  .av.brand-snapdeal::after{content:\"S\"}\n  .av.brand-meesho{background:#F43397;color:#fff;font-size:14px;font-weight:700;border-radius:50%;width:24px;height:24px}\n  .av.brand-meesho::after{content:\"m\"}\n\n  /* Ref-rows: bigger pill rows w/ generous padding — % pill tucked behind white pill */\n  .mid-card{background:#EDEAE5;padding:14px;border:none;border-radius:28px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -16px rgba(0,0,0,.08)}\n  .ref-rows{gap:8px;background:transparent;border-radius:0;padding:0;display:flex;flex-direction:column}\n  .ref-row{\n    background:transparent;border-radius:0;padding:0;\n    display:flex;align-items:center;gap:0;font-size:18px;color:#9A9A9F;font-weight:500;\n  }\n  .ref-pill{\n    background:#fff;border-radius:999px;padding:14px 18px 14px 16px;\n    display:flex;align-items:center;gap:14px;flex:1;min-width:0;\n    position:relative;z-index:2;\n    box-shadow:0 1px 2px rgba(0,0,0,.04);\n  }\n  .ref-row .av{width:34px;height:34px}\n  .ref-name{flex:1;color:#9A9A9F}\n  .ref-amt{color:var(--ink);font-weight:700;font-size:18px;letter-spacing:-.2px}\n  .ref-pct{\n    background:linear-gradient(180deg,#EFEDE9,#E6E3DE);color:#9A9A9F;font-size:14px;font-weight:600;\n    padding:7px 14px 7px 28px; border-radius:999px;text-align:center;line-height:1;\n    flex:none; margin-left:-22px;        /* tuck behind the right edge of the white pill */\n    position:relative; z-index:1;\n  }\n  .card-head .sort-btn{background:transparent;border:none;padding:6px 4px;gap:8px}\n  .card-head .filter-pill{border:1px solid #D9D5CF;background:transparent;padding:8px 14px;font-size:14px;gap:8px}\n\n  /* ===== Bar chart card (card 2) ===== */\n  .mid-card.bar-card{\n    display:flex;flex-direction:column;gap:18px;padding:20px 18px 18px;\n    background:#EDEAE5;border:none;border-radius:24px;\n    box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -16px rgba(0,0,0,.08);\n  }\n  .bar-card .card-head .sort-btn{background:transparent;border:none;padding:4px;gap:6px;color:#1f1f22}\n  .bar-card .card-head .filter-pill{border:1px solid #D9D5CF;background:transparent;padding:8px 14px;font-size:14px;gap:8px;color:#1f1f22}\n  .brand-bars{\n    display:grid;grid-template-columns:repeat(5,1fr);gap:10px;\n    height:240px;align-items:end;padding:0;\n  }\n  .bar{\n    background:#fff;border-radius:999px;width:100%;\n    position:relative;display:flex;justify-content:center;align-items:flex-start;\n    padding-top:18px;overflow:hidden;\n  }\n  .bar.h-behance{height:60%}\n  .bar.h-dribbble{height:95%}\n  .bar.h-google{height:55%}\n  .bar.h-instagram{height:42%}\n  .bar.h-bag{height:78%}\n  /* Behance split: hatched top, white bottom, logo at boundary */\n  .bar.split{\n    background:\n      linear-gradient(180deg,transparent 0 50%,#fff 50% 100%),\n      repeating-linear-gradient(135deg,#E0DDD7 0 3px,#EDEAE5 3px 9px);\n    align-items:center;padding-top:0;\n  }\n  .bar.split .av{margin-top:0}\n  /* Fully hatched bar */\n  .bar.hatched{\n    background:repeating-linear-gradient(135deg,#E0DDD7 0 3px,#EDEAE5 3px 9px);\n  }\n  .bar .av,.bar .bag{\n    width:32px;height:32px;display:grid;place-items:center;flex:none;background:transparent;\n  }\n  .bar .av svg,.bar .bag svg{width:100%;height:100%;display:block}\n  .bar-foot{display:flex;flex-direction:column;gap:3px;line-height:1.2;margin-top:2px}\n  .bar-foot .lab{font-size:15px;color:#9A9A9F;font-weight:500}\n  .bar-foot .val{font-size:18px;color:var(--ink);font-weight:700;letter-spacing:-.01em;display:inline-flex;align-items:center;gap:6px}\n\n  /* ---------- Phase 5: Three-up middle ---------- */\n  .mid-grid{\n    display:grid;\n    grid-template-columns:minmax(190px,1fr) minmax(190px,1fr) minmax(360px,1.7fr);\n    grid-template-rows:auto auto;\n    gap:12px;\n    margin-top:14px;\n    min-width:980px;       /* keeps the design honest at narrow viewports — canvas will scroll */\n  }\n  .mid-grid > .dc-card{ grid-column:3; grid-row:1 / span 2 }\n  .mid-grid > .pdv-card{ grid-column:1 / span 2; grid-row:2; min-width:0 }\n\n  /* Stack when truly tiny — pdv full width, dc full width below */\n  @media (max-width: 760px){\n    .mid-grid{\n      grid-template-columns:1fr 1fr;\n      grid-template-rows:auto auto auto;\n      min-width:0;\n    }\n    .mid-grid > .dc-card{ grid-column:1 / -1; grid-row:3 }\n    .mid-grid > .pdv-card{ grid-column:1 / -1; grid-row:2 }\n  }\n  .mid-card{\n    background:#fff;border:1px solid #EDEAE6;border-radius:14px;\n    padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0;\n  }\n  .card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}\n  .sort-btn,.filter-pill{\n    display:inline-flex;align-items:center;gap:6px;\n    background:#F4F2EF;border:1px solid #EDEAE6;border-radius:var(--r-pill);\n    padding:5px 10px;font-size:12px;color:#3a3a3d;font-weight:500;cursor:pointer;\n  }\n  .filter-pill{background:#fff}\n  /* (Older bare referrer-row rules removed — the pill/percent overlap styling\n     lives earlier in this stylesheet under \"Ref-rows\".) */\n  /* Donut */\n  .donut-wrap{position:relative;width:130px;height:130px;margin:6px auto 0}\n  .donut-badge{position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid #EDEAE6;display:grid;place-items:center}\n  .donut-foot{margin-top:auto;font-size:12px;color:#6E6C68}\n  .donut-foot .by{font-size:11px;color:#9A9A9F;display:inline-flex;align-items:center;gap:4px}\n  /* User table */\n  .user-table{padding:10px 12px}\n  .user-table .th,.user-table .tr{\n    display:grid;grid-template-columns:1.4fr .9fr .7fr .5fr .9fr;gap:8px;align-items:center;\n    font-size:11.5px;color:#9A9A9F;padding:4px 0;\n  }\n  .user-table .tr{color:var(--ink);font-size:13px;font-weight:500;border-top:1px solid #F4F2EF;padding:8px 0;position:relative}\n  .user-table .th{padding-bottom:2px}\n  .user-table .u{display:flex;align-items:center;gap:8px;font-weight:500}\n  .pill-dark{display:inline-grid;place-items:center;background:var(--ink);color:#fff;border-radius:var(--r-pill);padding:2px 7px;font-size:11px;font-weight:600;min-width:20px}\n  .row-expand{\n    position:absolute;right:-6px;top:50%;transform:translateY(-50%);\n    width:18px;height:18px;border-radius:50%;background:var(--pink);color:#fff;\n    border:none;display:grid;place-items:center;cursor:pointer;\n    box-shadow:0 4px 10px -4px rgba(236,45,110,.5);\n  }\n  .tr-tags{display:flex;align-items:center;gap:8px;padding:6px 0 2px;flex-wrap:wrap}\n  .tag{\n    display:inline-flex;align-items:center;gap:4px;\n    background:#F4F2EF;border-radius:var(--r-pill);padding:4px 10px;\n    font-size:11.5px;color:#3a3a3d;font-weight:500;\n  }\n\n  /* ===== Phase 6: Platforms + Sales dynamic card ===== */\n  .platforms-card{\n    position:relative;\n    margin-top:14px;\n    background:\n      radial-gradient(ellipse 70% 90% at 20% 30%, #FFCBD8 0%, transparent 55%),\n      radial-gradient(ellipse 90% 100% at 95% 95%, #FFDDC8 0%, transparent 50%),\n      linear-gradient(135deg, #FDE0E8 0%, #F4F0EC 80%);\n    border-radius:24px;\n    padding:18px 20px 22px;\n    box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 28px -18px rgba(20,20,30,.12);\n    overflow:hidden;\n  }\n  .platforms-card .corner-arrow{\n    position:absolute;top:18px;right:18px;\n    width:26px;height:26px;display:grid;place-items:center;color:#1f1f22;cursor:pointer;\n  }\n  .platforms-card .sec-title{\n    font-size:15px;font-weight:600;color:var(--ink);margin:0 0 12px;letter-spacing:-.01em;\n  }\n\n  /* Treemap */\n  .treemap{\n    display:grid;grid-template-columns:1.35fr 1fr;\n    grid-template-rows:220px;gap:8px;\n    margin-bottom:24px;\n  }\n  .tm-tile{\n    background:rgba(255,255,255,.88);\n    border-radius:14px;\n    padding:12px 14px;\n    display:flex;flex-direction:column;justify-content:space-between;\n    position:relative;overflow:hidden;min-height:0;\n  }\n  .tm-tile .logo-row{\n    display:flex;align-items:center;gap:8px;\n    font-size:13px;color:#1f1f22;font-weight:500;\n  }\n  .tm-tile .logo-row .mk{\n    width:18px;height:18px;display:grid;place-items:center;flex:none;\n  }\n  .tm-tile .logo-row .mk svg{width:100%;height:100%;display:block}\n  .tm-tile .stat{\n    display:flex;align-items:baseline;gap:8px;line-height:1;\n  }\n  .tm-tile .stat .pct{\n    font-size:26px;font-weight:600;letter-spacing:-.02em;color:var(--ink);\n  }\n  .tm-tile .stat .amt{\n    font-size:16px;font-weight:500;color:#C9C6C2;letter-spacing:-.01em;\n  }\n  .tm-tile.dribbble{padding:14px 16px}\n  .tm-tile.dribbble .stat .pct{font-size:36px}\n  .tm-tile.dribbble .stat .amt{font-size:20px}\n\n  /* Diagonal hatch corner decoration */\n  .tm-tile.hatch-corner::after{\n    content:\"\";position:absolute;top:0;right:0;\n    width:60%;height:55%;\n    background:repeating-linear-gradient(135deg,#E8E4DD 0 2px,#F4F0EA 2px 8px);\n    -webkit-mask-image:linear-gradient(225deg,#000 0,#000 35%,transparent 75%);\n            mask-image:linear-gradient(225deg,#000 0,#000 35%,transparent 75%);\n    pointer-events:none;opacity:.85;\n  }\n  .tm-tile.hatch-right::after{\n    content:\"\";position:absolute;top:0;right:0;bottom:0;\n    width:42%;\n    background:repeating-linear-gradient(135deg,#E8E4DD 0 2px,#F4F0EA 2px 8px);\n    -webkit-mask-image:linear-gradient(270deg,#000 0,#000 55%,transparent 100%);\n            mask-image:linear-gradient(270deg,#000 0,#000 55%,transparent 100%);\n    pointer-events:none;opacity:.85;\n  }\n\n  .tm-right{display:grid;grid-template-rows:1.05fr .85fr .85fr;gap:8px;min-width:0;min-height:0;height:100%}\n  .tm-right .tm-row{display:grid;grid-template-columns:1.6fr 1fr;gap:8px;min-width:0;min-height:0}\n  .tm-tile.compact{padding:8px 12px}\n  .tm-tile.compact .logo-row{font-size:12px}\n  .tm-tile.compact .stat{align-items:center;gap:6px}\n  .tm-tile.compact .stat .pct{font-size:15px;font-weight:600}\n  .tm-tile.compact .stat .amt{font-size:12px}\n  .tm-tile.compact.horizontal{flex-direction:row;align-items:center;justify-content:space-between;padding:10px 14px}\n\n  /* selection halo on Instagram tile */\n  .tm-tile.selected{\n    box-shadow:\n      0 0 0 2px rgba(236,45,110,.18),\n      0 6px 16px -8px rgba(236,45,110,.35);\n  }\n  .tm-tile.selected::before{\n    content:\"\";position:absolute;inset:0;border-radius:14px;pointer-events:none;\n    background:\n      radial-gradient(circle at 100% 30%, rgba(255,170,140,.35) 0%, transparent 45%),\n      radial-gradient(circle at 0% 100%, rgba(236,45,110,.18) 0%, transparent 50%);\n  }\n\n  /* Sales dynamic */\n  .sales-dynamic{position:relative}\n  .sd-head{\n    display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;\n  }\n  .sd-head h4{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}\n  .sd-chart{width:100%;height:130px;display:block}\n  .sd-week-row{\n    display:grid;grid-template-columns:repeat(6,1fr);\n    font-size:11.5px;color:#C9C6C2;font-weight:500;\n    margin-top:-12px;padding:0 4px;\n  }\n  .sd-week-row span{text-align:center}\n  .sd-week-row span:first-child{text-align:left}\n  .sd-week-row span:last-child{text-align:right}\n\n  /* avatar markers anchored to the chart base line */\n  .sd-markers{\n    position:absolute;left:0;right:0;bottom:30px;height:0;pointer-events:none;\n  }\n  .sd-marker{\n    position:absolute;transform:translate(-50%,-50%);\n    width:24px;height:24px;border-radius:50%;\n    display:grid;place-items:center;background:#fff;\n    box-shadow:0 2px 6px rgba(0,0,0,.10), 0 0 0 2px #fff;\n  }\n  .sd-marker.behance{background:#1769FF;color:#fff;font-weight:800;font-size:11px;font-style:italic}\n  .sd-marker.dribbble{background:#EA4C89;color:#fff}\n  .sd-marker.instagram{\n    background:conic-gradient(from 180deg,#FEDA77,#F58529,#DD2A7B,#8134AF,#FEDA77);\n    color:#fff;\n  }\n  .sd-marker .badge{\n    position:absolute;top:-4px;right:-4px;\n    width:12px;height:12px;border-radius:50%;\n    background:var(--pink);color:#fff;font-size:8px;font-weight:700;\n    display:grid;place-items:center;border:2px solid #fff;\n  }\n\n  /* Top of icon rail: a faint vertical divider between rail and tree */\n  .rail{border-right:1px solid rgba(0,0,0,.04)}\n\n  /* Bottom-anchored rail items */\n  .rail-bottom{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:6px}\n\n  /* Tiny chevron */\n  .chev{transition:transform .15s}\n  .tree-row.open .chev{transform:rotate(90deg)}\n\n  /* ===================== Platform Value Dribbble (PDV) Card ===================== */\n  .pdv-card{\n    position:relative;\n    background:#F1EDE7;\n    border-radius:24px;\n    overflow:hidden;\n    box-shadow:0 1px 2px rgba(0,0,0,.04), 0 14px 30px -18px rgba(20,20,30,.14);\n    display:grid;\n    grid-template-columns: minmax(190px, 220px) minmax(0, 1fr);\n    min-height:300px;\n  }\n  /* Header lives inside the right column, in normal flow — no overlap */\n  .pdv-head{\n    display:flex; align-items:center; justify-content:space-between;\n    gap:10px; flex-wrap:wrap;\n    padding:14px 4px 0;\n    flex:none;\n  }\n  .pdv-title{display:flex; align-items:center; gap:12px}\n  .pdv-title .mk{\n    width:36px;height:36px;display:grid;place-items:center;flex:none;\n    color:#D63878;\n  }\n  .pdv-title .mk svg{width:100%;height:100%;display:block}\n  .pdv-eyebrow{font-size:13px;color:#A8A6A2;font-weight:500;line-height:1.1;letter-spacing:-.01em}\n  .pdv-name{\n    display:flex;align-items:center;gap:6px;\n    font-size:19px;color:var(--ink);font-weight:700;letter-spacing:-.01em;\n    margin-top:1px;\n  }\n  .pdv-name svg{color:#1f1f22}\n\n  .pdv-tabs{\n    display:inline-flex;align-items:center;gap:6px;\n    background:#fff;border-radius:999px;padding:4px;\n    box-shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 14px -10px rgba(0,0,0,.15);\n  }\n  .pdv-tab{\n    border:0;background:transparent;cursor:pointer;\n    padding:8px 18px;border-radius:999px;\n    font:600 13px/1 'Geist',sans-serif;color:var(--ink);\n    transition:background .15s, color .15s;\n  }\n  .pdv-tab:hover{background:#F4F2EF}\n  .pdv-tab.active{background:var(--ink);color:#fff}\n  .pdv-tab.active:hover{background:#000}\n\n  /* Left pink panel */\n  .pdv-left{\n    background:#D63878;\n    color:#fff;\n    border-top-right-radius:28px;\n    border-bottom-right-radius:28px;\n    padding:24px 22px 22px 38px;\n    position:relative;\n    display:flex; flex-direction:column; justify-content:center; gap:18px;\n  }\n  .pdv-vlabel{\n    position:absolute; left:14px; top:50%;\n    transform:translateY(-50%) rotate(180deg);\n    writing-mode:vertical-rl;\n    font-size:12px; font-weight:500;\n    color:rgba(255,255,255,.55);\n    letter-spacing:.02em;\n    white-space:nowrap;\n  }\n  .pdv-stat{display:flex;flex-direction:column;gap:4px;line-height:1}\n  .pdv-stat .l{font-size:14px;color:rgba(255,255,255,.55);font-weight:500}\n  .pdv-stat .v{\n    font-size:22px;font-weight:700;letter-spacing:-.01em;\n    display:flex;align-items:baseline;gap:8px;\n  }\n  .pdv-stat .v .sub{font-size:18px;font-weight:700;color:rgba(255,255,255,.55)}\n\n  /* Right chart panel */\n  .pdv-right{\n    position:relative;\n    padding:0 16px 14px 16px;\n    display:flex; flex-direction:column;\n    min-width:0;\n  }\n  .pdv-plot{\n    position:relative; flex:1;\n    display:grid; grid-template-columns:minmax(0,1fr) 56px;\n    gap:8px;\n    min-height:200px;\n    padding-top:36px;     /* room for tooltip pills above tallest bars */\n  }\n  .pdv-bars{\n    position:relative;\n    display:grid;\n    grid-template-columns:repeat(3,1fr);\n    column-gap:10px;\n    align-items:end;\n    padding-bottom:34px;\n  }\n  /* Horizontal grid lines, anchored to y-axis labels */\n  .pdv-bars::before{\n    content:\"\";\n    position:absolute; left:0; right:0; top:0; bottom:34px;\n    background-image:\n      linear-gradient(#E9E3DC 1px, transparent 1px);\n    background-size:100% calc((100% - 1px) / 3);\n    background-position:0 0;\n    pointer-events:none;\n  }\n  .pdv-bars::after{\n    content:\"\";\n    position:absolute; left:0; right:0; bottom:34px; height:1px;\n    background:#E9E3DC; pointer-events:none;\n  }\n  .pdv-group{\n    display:grid; grid-template-columns:repeat(3, 1fr);\n    column-gap:8px; align-items:end;\n    height:100%;\n    position:relative;\n  }\n  .pdv-bar{\n    position:relative;\n    width:100%;\n    background:#E7E1D9;\n    border-top-left-radius:22px;\n    border-top-right-radius:22px;\n    border-bottom-left-radius:14px;\n    border-bottom-right-radius:14px;\n    transition:transform .15s ease, background .15s ease;\n  }\n  .pdv-bar.hatched{\n    background:\n      repeating-linear-gradient(135deg, #C9C2B8 0 2px, transparent 2px 9px),\n      #EEE9E1;\n    border:1px solid #D9D2C8;\n  }\n  /* Tooltip pill — sits above the bar */\n  .pdv-tip{\n    position:absolute;\n    left:50%; bottom:calc(100% + 8px);\n    transform:translateX(-50%);\n    background:var(--pink);\n    color:#fff;\n    border-radius:10px;\n    padding:6px 12px;\n    font-size:13px; font-weight:700; letter-spacing:-.01em;\n    white-space:nowrap;\n    box-shadow:0 8px 16px -8px rgba(214,56,120,.55);\n    z-index:2;\n    pointer-events:none;\n  }\n  .pdv-tip::after{\n    content:\"\"; position:absolute;\n    left:50%; bottom:-4px; transform:translateX(-50%) rotate(45deg);\n    width:8px;height:8px;background:var(--pink);\n    border-radius:1px;\n  }\n  /* Expanded tooltip (hover state) */\n  .pdv-tip.rich{\n    padding:8px 12px 8px 12px;\n    display:flex;flex-direction:column;align-items:center;gap:2px;\n    line-height:1.15;\n  }\n  .pdv-tip.rich .m{\n    font-size:18px; font-weight:700;\n  }\n  .pdv-tip.rich .s{\n    font-size:11.5px; font-weight:600;\n    color:rgba(255,255,255,.85);\n  }\n  .pdv-tip.rich .p{\n    font-size:11.5px; font-weight:700;\n    color:#fff;\n  }\n  .pdv-cursor{\n    position:absolute;\n    left:54%; bottom:-12px;\n    width:18px;height:22px;\n    pointer-events:none;\n    filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));\n  }\n\n  /* swap default <-> rich on hover */\n  .pdv-bar .pdv-tip.rich{display:none}\n  .pdv-bar:hover .pdv-tip:not(.rich){display:none}\n  .pdv-bar:hover .pdv-tip.rich{display:flex}\n  .pdv-bar:hover .pdv-cursor{display:block}\n  .pdv-cursor{display:none}\n  /* show the rich tip on the \"active\" preview bar by default */\n  .pdv-bar.preview .pdv-tip:not(.rich){display:none}\n  .pdv-bar.preview .pdv-tip.rich{display:flex}\n  .pdv-bar.preview .pdv-cursor{display:block}\n\n  /* Avatars + month labels under bars */\n  .pdv-axis{\n    position:absolute; left:0; right:0; bottom:0;\n    display:grid; grid-template-columns:repeat(3,1fr); column-gap:10px;\n    pointer-events:none;\n  }\n  .pdv-axis-cell{\n    display:flex;flex-direction:column;align-items:center;gap:2px;\n  }\n  .pdv-avs{\n    display:grid; grid-template-columns:repeat(3,1fr);\n    column-gap:8px; width:100%;\n    margin-top:-2px;\n  }\n  .pdv-avs > .av-wrap{display:flex; justify-content:center}\n  .pdv-av{\n    width:22px;height:22px;border-radius:50%;\n    background-size:cover; background-position:center;\n    box-shadow:0 0 0 2px #F1EDE7;\n    flex:none;\n  }\n  .pdv-av.m1{background:radial-gradient(circle at 35% 30%, #FFD1B8, #C76A38 70%)}\n  .pdv-av.m2{background:radial-gradient(circle at 35% 30%, #C8E1FF, #2E80C6 70%)}\n  .pdv-av.m3{background:radial-gradient(circle at 35% 30%, #FFE4B8, #B27A3A 70%)}\n  .pdv-month{\n    font-size:13px;color:#B8B6B2;font-weight:500;margin-top:6px;\n  }\n\n  /* Right side Y-axis labels */\n  .pdv-yaxis{\n    display:flex;flex-direction:column;justify-content:space-between;\n    padding-bottom:34px;\n    font-size:13px;color:#C9C6C2;font-weight:500;\n    text-align:right;\n    line-height:1;\n  }\n\n  /* ===================== DC Card (new appended card) ===================== */\n  .dc-card{\n    position:relative;\n    background:\n      radial-gradient(900px 500px at 15% 20%, #FFD8E2 0%, transparent 55%),\n      radial-gradient(700px 500px at 100% 100%, #FFE0CC 0%, transparent 55%),\n      linear-gradient(160deg, #FCEAEF 0%, #F4ECE5 80%);\n    border-radius:20px;\n    padding:10px;\n    box-shadow:0 1px 2px rgba(0,0,0,.04),0 14px 30px -18px rgba(20,20,30,.14);\n    overflow:hidden;\n    isolation:isolate;\n    display:flex;flex-direction:column;gap:8px;min-width:0;\n  }\n\n  /* table at top */\n  .dc-table{\n    background:#fff;\n    border-radius:14px;\n    padding:6px 10px 0;\n    box-shadow:0 6px 16px -12px rgba(40,20,10,.16);\n  }\n  .dc-thead,.dc-trow{\n    display:grid;\n    grid-template-columns: 1.4fr 1fr .55fr .55fr .55fr .55fr .55fr .8fr;\n    align-items:center; gap:4px;\n  }\n  .dc-thead{\n    color:#9A9A9F; font-size:10.5px; font-weight:500;\n    padding:4px 2px 6px;\n    border-bottom:1px solid #F4F0EB;\n  }\n  .dc-thead .c{text-align:right}\n  .dc-thead .c.name{text-align:left}\n  .dc-thead .c.rev{text-align:left;padding-left:2px}\n\n  .dc-trow{\n    padding:8px 2px;\n    border-bottom:1px solid #F6F2EE;\n    font-size:11.5px; font-weight:600; color:var(--ink);\n  }\n  .dc-trow:last-child{border-bottom:none}\n  .dc-trow .c{text-align:right;font-variant-numeric:tabular-nums}\n  .dc-trow .c.name{text-align:left;display:flex;align-items:center;gap:6px;font-size:12px}\n  .dc-trow .c.rev{text-align:left;padding-left:2px}\n\n  .dc-av{\n    width:22px;height:22px;border-radius:50%;\n    box-shadow:0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,.08);\n    flex:none;\n  }\n  .dc-av.a1{background:radial-gradient(circle at 35% 30%, #FFD1B8, #D97A4A 70%)}\n  .dc-av.a2{background:radial-gradient(circle at 35% 30%, #CFE4FF, #3B82B8 70%)}\n  .dc-av.a3{background:radial-gradient(circle at 35% 30%, #FFD9A8, #B76A3A 70%)}\n\n  .dc-pill{\n    display:inline-grid;place-items:center;\n    min-width:26px;height:20px;padding:0 7px;\n    background:var(--ink);color:#fff;border-radius:999px;\n    font-weight:700;font-size:10.5px;\n  }\n  .dc-chev{\n    width:22px;height:22px;border-radius:50%;\n    background:var(--pink);color:#fff;\n    display:inline-grid;place-items:center;margin-left:auto;\n    box-shad
